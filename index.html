<!DOCTYPE html>
<!-- 다면평가 웹앱 화면 (GitHub Pages). 자료 저장·처리는 config.js 에 적힌 Apps Script 웹앱이 맡습니다. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>다면평가</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- ===== Style ===== -->
<style>
:root {
  --bg: #f4f6f8; --card: #ffffff; --line: #d5dbe1; --line2: #e8ecf0; --text: #1f2933; --muted: #5f6b76;
  --brand: #1f5fa8; --brand-weak: #e7f0fa; --ok: #1e7b4b; --ok-weak: #e3f4ea; --warn: #b42318; --warn-weak: #fdecea;
  --auto: #f1f4f7; --amber: #9a6700; --amber-weak: #fff4d6;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 15px; line-height: 1.7; word-break: keep-all; overflow-wrap: break-word; letter-spacing: -0.1px; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
.topbar { background: var(--card); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--line); background: #fff; padding: 6px 16px; border-radius: 6px; cursor: pointer; }
.tab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.spacer { flex: 1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card h2 { margin: 0 0 12px; font-size: 17px; }
.card h3 { margin: 16px 0 8px; font-size: 15px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
label.f { display: block; margin-bottom: 10px; }
label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=password], input[type=number], input[type=datetime-local], select, textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #fff; max-width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-weak); border-color: var(--brand); }
input.w100 { width: 100%; }
textarea { width: 100%; min-height: 54px; resize: vertical; }
.btn { border: 1px solid var(--line); background: #fff; padding: 7px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.danger { color: var(--warn); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); background: #fff; white-space: nowrap; }
.badge.ok { background: var(--ok-weak); color: var(--ok); border-color: #b6e0c6; }
.badge.warn { background: var(--warn-weak); color: var(--warn); border-color: #f5c2bd; font-weight: 700; }
.badge.info { background: var(--brand-weak); color: var(--brand); border-color: #c4d9f1; }
.badge.amber { background: var(--amber-weak); color: var(--amber); border-color: #f0d68a; }
.notice { padding: 12px 16px; border-radius: 6px; background: var(--brand-weak); margin-bottom: 14px; line-height: 1.9; }
.notice.warn { background: var(--warn-weak); color: var(--warn); }
.notice.amber { background: var(--amber-weak); color: #6b4a00; }

/* 표 */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
table.t { border-collapse: collapse; width: 100%; }
table.t th, table.t td { border: 1px solid var(--line2); padding: 10px 12px; vertical-align: middle; }
table.t th { background: #f7f9fb; font-weight: 600; font-size: 14px; text-align: center; }
table.t td { text-align: center; }
table.t td.c { text-align: center; }
table.t td.num { text-align: center; font-variant-numeric: tabular-nums; }
/* 여러 줄 설명 글(평가 기준, 근거)은 읽기 쉽도록 왼쪽 정렬 유지 */
table.t td.cr, table.t td.bs, table.t td.pre, table.t td.left { text-align: left; }
table.t td.rank { font-weight: 700; white-space: nowrap; }
table.t tr.sub td { background: #f7f9fb; font-weight: 600; }
table.t tr.total td { background: var(--brand-weak); font-weight: 700; }
table.sticky thead { position: sticky; top: 0; z-index: 2; }
table.sticky td.stick, table.sticky th.stick { position: sticky; left: 0; background: #fff; z-index: 1; }
table.sticky thead th.stick { z-index: 3; background: #f7f9fb; }
.tw.tall { max-height: 70vh; overflow: auto; }

/* 평가표 */
table.form { min-width: 980px; }
table.form td.el { width: 100px; text-align: center; font-weight: 600; background: #fafbfc; line-height: 1.6; }
table.form td.it { width: 150px; line-height: 1.6; }
table.form td.cr { width: 290px; font-size: 13.5px; line-height: 1.85; color: #36414b; vertical-align: top; }
table.form td.al { width: 72px; text-align: center; font-size: 13px; }
table.form td.sc { width: 104px; text-align: center; }
table.form td.sc.auto { background: var(--auto); }
table.form td.bs { font-size: 13.5px; line-height: 1.85; vertical-align: top; }
.note { color: var(--muted); font-size: 12.5px; }
.pre { white-space: pre-line; line-height: 1.8; }
.autobar { display: flex; gap: 14px; align-items: center; padding: 12px 14px; margin-bottom: 14px; background: var(--brand-weak); border-radius: 8px; line-height: 1.8; }
.autobar .btn { flex: none; padding: 9px 20px; font-size: 15px; }
textarea.basis-in { min-height: 44px; font-size: 13.5px; line-height: 1.8; overflow: hidden; }
.linkbtn { border: 0; background: none; color: var(--brand); font-size: 12.5px; padding: 2px 0; cursor: pointer; text-decoration: underline; }
.srcbadge { margin-top: 6px; min-height: 4px; }
@media (max-width: 720px) { .autobar { flex-direction: column; align-items: stretch; } }
.savebar { display: flex; justify-content: flex-end; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line2); }
.inrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
table.form.mobile { min-width: 0; width: 100%; table-layout: fixed; }
table.form.mobile td { word-break: keep-all; overflow-wrap: anywhere; }
table.form.mobile td.it { width: auto; }
table.form.mobile td.sc { width: auto; padding: 4px; }
table.form.mobile tr.grp td { background: #eef3f8; font-weight: 700; }
table.form.mobile .crit { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.75; }
table.form.mobile .scoreinput { width: 64px; }
.scorebox { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.scoreinput { width: 84px; text-align: center; font-weight: 700; }
.inline-in { width: 70px; text-align: right; }
.basis { color: #36414b; white-space: pre-line; line-height: 1.85; padding-top: 2px; }
.err { color: var(--warn); font-size: 12.5px; margin-top: 4px; }
.kv { display: flex; gap: 16px; flex-wrap: wrap; }
.kv div b { margin-left: 4px; }
.actions { position: sticky; bottom: 0; background: rgba(244,246,248,.96); padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.rules { margin-top: 12px; }
details.rules summary { cursor: pointer; color: var(--brand); }
details.rules ul { margin: 8px 0; padding-left: 20px; font-size: 14px; line-height: 1.85; }
details.rules li { margin-bottom: 6px; }

/* 관리 */
.subnav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.subnav .tab { font-size: 13px; }
.dirtybar { position: sticky; top: 0; z-index: 5; background: var(--amber-weak); border: 1px solid #f0d68a; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
table.grid td input[type=number] { width: 64px; }
table.grid td input[type=text] { width: 140px; }
table.grid td, table.grid th { white-space: nowrap; font-size: 13.5px; padding: 8px 10px; }
table.grid th.v { min-width: 34px; padding: 8px 4px; text-align: center; vertical-align: middle; }
table.grid th.v .vt { display: inline-block; writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap; }
table.grid td:not(.stick) { text-align: center; }
table.grid td input[type=number] { text-align: center; }
.wrap { padding-bottom: 24px; }
.stat { display: inline-block; margin-right: 14px; }
.stat b { font-size: 16px; margin-left: 4px; }
.code { font-family: Consolas, "Courier New", monospace; letter-spacing: 1px; font-weight: 700; }

/* 모달 · 알림 */
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,32,.45); display: flex; align-items: flex-start; justify-content: center; z-index: 50; overflow: auto; padding: 24px 12px; }
.modal { background: #fff; border-radius: 10px; width: 100%; max-width: 560px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.modal.wide { max-width: 1100px; }
.modal h3 { margin: 0 0 12px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; }
#toast .msg { background: #1f2933; color: #fff; padding: 9px 16px; border-radius: 6px; max-width: 90vw; }
#toast .msg.err { background: var(--warn); }
.loading { position: fixed; inset: 0; background: rgba(255,255,255,.55); z-index: 70; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.login { max-width: 400px; margin: 40px auto; }

@media print {
  body.print-codes .topbar, body.print-codes #app > *:not(#print-area), body.print-codes #toast { display: none !important; }
  body.print-codes #print-area { display: block !important; }
}
#print-area { display: none; }
.slip { display: inline-block; width: 31%; margin: 0 1% 10px; border: 1px dashed #888; padding: 10px; vertical-align: top; page-break-inside: avoid; }
.slip .nm { font-size: 16px; font-weight: 700; }
.slip .cd { font-size: 20px; letter-spacing: 3px; font-family: Consolas, monospace; font-weight: 700; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- ===== Calc ===== -->
<script>
/* 점수 계산 · 근거 생성 · 검증 (교사 화면과 관리 화면이 함께 사용) */
var Calc = (function () {
  var COUNTED = ['동아리', '스포츠클럽', '주제선택', '진로탐색'];
  var KINDS = ['동아리', '스포츠클럽', '주제선택', '진로탐색', '창체 진로', '기타'];
  var LIFE30 = ['담임', '학년부장', '학생생활교육부장', '학폭책임교사', '보건교사'];
  var LIFE_OPTIONS = LIFE30.concat(['그 외']);
  var ROLE_SCORE = { '부장': 27, '담임': 26, '비담임': 25 };
  var TYPES = ['일반', '진로', '특수', '순회', '보건', '사서'];
  var ITEMS = [
    { key: 'g1', label: '가. 학습지도 - 주당 수업시수', min: 23.5, max: 28 },
    { key: 'g2', label: '가. 학습지도 - 다학년 교과지도', min: 0, max: 1 },
    { key: 'g3', label: '가. 학습지도 - 창체 및 자유학기 지도', min: 0, max: 0.4 },
    { key: 'g4', label: '가. 학습지도 - 수업공개실적', min: 0, max: 1 },
    { key: 'n', label: '나. 생활지도 - 생활지도 곤란도', min: 29, max: 30 },
    { key: 'd', label: '다. 전문성개발 - 연수이수', min: 6, max: 10 },
    { key: 'r1', label: '라. 담당업무 - 업무곤란도', min: 0, max: 3 },
    { key: 'r2', label: '라. 담당업무 - 업무추진', min: 25, max: 27 }
  ];
  var M_FLAGS = [
    { key: 'plc', no: '②', label: '전문적학습공동체 운영자', short: '전학공 운영자', pt: 0.2 },
    { key: 'subjectHead', no: '③', label: '교과부장(학교교육과정위원회 포함)', short: '교과부장', pt: 0.2 },
    { key: 'itinerant', no: '④', label: '순회교사·보건교사', short: '순회·보건', pt: 0.2 },
    { key: 'council', no: '⑤', label: '학교운영위원회 위원', short: '학운위 위원', pt: 0.2 },
    { key: 'personnel', no: '⑥', label: '인사자문위원회 위원(다면평가관리위원)', short: '인사자문위원', pt: 0.2 }
  ];
  var M_COUNTS = [
    { key: 'c7', no: '⑦', label: '학업성적관리위원회', short: '학업성적관리위원회' },
    { key: 'c8', no: '⑧', label: '위기관리위원회', short: '위기관리위원회' },
    { key: 'c9', no: '⑨', label: '생활교육위원회', short: '생활교육위원회' },
    { key: 'c10', no: '⑩', label: '학업중단예방위원회', short: '학업중단예방위원회' }
  ];

  function r2(x) { return Math.round((Number(x) || 0) * 100 + 1e-7) / 100; }
  function num(x) { var n = Number(x); return (x === '' || x === null || x === undefined || isNaN(n)) ? 0 : n; }
  function has(x) { return !(x === '' || x === null || x === undefined || isNaN(Number(x))); }
  function f(x) { return String(r2(x)); }

  function hoursScore(h) {
    if (h <= 15) return 23.5;
    var steps = Math.ceil((h - 15) / 0.5 - 1e-9);
    return Math.min(28, 23.5 + 0.25 * steps);
  }
  function hoursBand(h) {
    if (h <= 15) return '15시간 이하';
    if (h > 24) return '24시간 초과(최대)';
    var steps = Math.ceil((h - 15) / 0.5 - 1e-9);
    return '~' + f(15 + steps * 0.5) + '시간';
  }
  function healthScore(c) {
    return c >= 1300 ? 28 : c >= 1200 ? 27 : c >= 1100 ? 26 : c >= 1000 ? 25 : 24;
  }
  function trainingScore(h) {
    return h >= 60 ? 10 : h >= 45 ? 9 : h >= 30 ? 8 : h >= 15 ? 7 : 6;
  }
  function gradePoint(g) { return g >= 3 ? 0.5 : g === 2 ? 0.25 : 0; }
  function progPoint(n) { return n >= 4 ? 0.2 : n === 3 ? 0.15 : n === 2 ? 0.1 : n === 1 ? 0.05 : 0; }
  function semName(i) { return (i + 1) + '학기'; }

  function semHours(sem) {
    var team = 0;
    (sem.programs || []).forEach(function (p) { if (p.team) team += num(p.hours); });
    return { raw: num(sem.hours), team: team, recog: num(sem.hours) - team / 2 };
  }

  /* 학교 평균 시수(일반·진로·특수·순회 교사의 인정 시수 평균) */
  function schoolAvgHours(refs) {
    var sum = 0, n = 0;
    Object.keys(refs || {}).forEach(function (id) {
      var r = refs[id];
      if (!r || r.avgHours || r.type === '보건' || r.type === '사서') return;
      var w = (r.sems || []).filter(function (s) { return s.worked; });
      if (!w.length) return;
      var h = 0;
      w.forEach(function (s) { h += semHours(s).recog; });
      sum += h / w.length; n++;
    });
    return n ? r2(sum / n) : 0;
  }

  /* 기준자료로 자동 계산. inputs: 교사가 입력하는 값(외부 공개 횟수, 연수 시간, 표창 건수) */
  function compute(ref, settings, inputs) {
    ref = ref || {};
    inputs = inputs || {};
    var S = {}, B = {};
    var sems = ref.sems || [];
    var worked = [];
    sems.forEach(function (s, i) { if (s.worked) worked.push({ s: s, i: i }); });

    // 가1 주당 수업시수
    if (ref.type === '보건') {
      var c = num(ref.healthCases);
      S.g1 = healthScore(c);
      B.g1 = '보건처치·치료 ' + c + '건\n→ ' + S.g1 + '점 (보건교사 인정 점수표)';
    } else if (ref.avgHours) {
      var ah = num(settings && settings.avgHours);
      S.g1 = hoursScore(ah);
      B.g1 = '평균 시수 인정' + (ref.avgReason ? '(' + ref.avgReason + ')' : '') + '\n학교 평균 ' + f(ah) + '시간\n→ ' + hoursBand(ah) + ' 구간 ' + S.g1 + '점';
    } else if (!worked.length) {
      S.g1 = 23.5;
      B.g1 = '근무 학기 자료 없음\n→ 기본 23.5점';
    } else {
      var parts = [], tot = 0;
      worked.forEach(function (w) {
        var h = semHours(w.s);
        tot += h.recog;
        parts.push(semName(w.i) + ': ' + f(h.raw) + '시간' + (h.team ? ' (팀티칭 ' + f(h.team) + '시간은 1/2만 인정 → ' + f(h.recog) + '시간)' : ''));
      });
      var avg = tot / worked.length;
      S.g1 = hoursScore(avg);
      B.g1 = parts.join('\n') + (worked.length === 2 ? '\n→ (1학기+2학기)÷2 = ' : '\n→ ' + semName(worked[0].i) + '만 근무: ') +
        f(avg) + '시간\n→ ' + hoursBand(avg) + ' 구간 ' + S.g1 + '점';
    }

    // 가2 다학년 교과지도
    var g2 = 0, p2 = [];
    worked.forEach(function (w) {
      var g = ref.type === '특수' ? 2 : num(w.s.grades);
      var pt = gradePoint(g);
      g2 += pt;
      p2.push(semName(w.i) + ': ' + g + '개 학년' + (ref.type === '특수' ? ' (특수교사 2개 학년 인정)' : '') + ' → ' + f(pt) + '점');
    });
    S.g2 = r2(g2);
    var nonClass = (ref.type === '보건' || ref.type === '사서') && !g2;
    B.g2 = nonClass ? '비교과 교사: 해당 없음' : p2.length ? p2.join('\n') + '\n= 합계 ' + S.g2 + '점' : '해당 없음';

    // 가3 창체 및 자유학기 지도
    var g3 = 0, p3 = [];
    worked.forEach(function (w) {
      var cnt = {}, n = 0, ex = 0;
      (w.s.programs || []).forEach(function (p) {
        if (COUNTED.indexOf(p.kind) < 0) return;
        if (p.team) ex++;   // 팀티칭 프로그램도 지도 실적으로 셈(시수만 1/2 인정)
        cnt[p.kind] = (cnt[p.kind] || 0) + 1; n++;
      });
      var pt = progPoint(n);
      g3 += pt;
      var desc = Object.keys(cnt).map(function (k) { return k + ' ' + cnt[k]; }).join(', ');
      p3.push(semName(w.i) + ': ' + (desc || '없음') + (n ? ' (' + n + '개)' : '') + (ex ? ' · 팀티칭 ' + ex + '개 포함' : '') + ' → ' + f(pt) + '점');
    });
    S.g3 = r2(g3);
    B.g3 = ((ref.type === '보건' || ref.type === '사서') && !g3) ? '비교과 교사: 해당 없음' : p3.length ? p3.join('\n') + '\n= 합계 ' + S.g3 + '점' : '해당 없음';

    // 가4 수업공개(교사 입력)
    var oc = num(inputs.openCount);
    S.g4 = Math.min(1, r2(oc * 0.5));

<script>
/* 원본 평가표(HWPX)의 '본인 점수' 칸을 채워 새 HWPX 생성 */
var Hwpx = (function () {
  // 본인 점수 열(colAddr=4)의 행 번호 → 넣을 값
  var ROWS = { 1: 'g1', 2: 'g2', 4: 'g3', 8: 'g4', 9: 'ga', 10: 'n', 12: 'na', 13: 'd', 18: 'da', 19: 'r1', 20: 'r2', 23: 'ra', 24: 'total' };
  var SECTION = 'Contents/section0.xml';
  var tpl = null;   // { names:[], files:{name:Uint8Array}, section:string }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmt(v) {
    if (v === null || v === undefined || v === '') return '';
    var n = Math.round(Number(v) * 100 + 1e-7) / 100;
    return String(n);
  }

  function load(b64) {
    if (tpl) return Promise.resolve(tpl);
    return JSZip.loadAsync(b64, { base64: true }).then(function (zip) {
      var names = [];
      zip.forEach(function (path, file) { if (!file.dir) names.push(path); });
      var t = { names: names, files: {} };
      return Promise.all(names.map(function (n) {
        return zip.file(n).async('uint8array').then(function (d) { t.files[n] = d; });
      })).then(function () {
        return zip.file(SECTION).async('string');
      }).then(function (s) { t.section = s; tpl = t; return t; });
    });
  }

  /* 한 칸(첫 문단)의 내용을 값으로 교체. 계산식 필드도 일반 숫자로 바뀜 */
  function setCell(xml, row, value) {
    var key = '<hp:cellAddr colAddr="4" rowAddr="' + row + '"/>';
    var pos = xml.indexOf(key);
    if (pos < 0) throw new Error('양식에서 칸을 찾지 못했습니다(행 ' + row + ').');
    var start = xml.lastIndexOf('<hp:tc ', pos);
    var pStart = xml.indexOf('<hp:p ', start);
    var pOpenEnd = xml.indexOf('>', pStart) + 1;
    var segPos = xml.indexOf('<hp:linesegarray>', pOpenEnd);
    var pEnd = xml.indexOf('</hp:p>', pOpenEnd);
    var runsEnd = (segPos > 0 && segPos < pEnd) ? segPos : pEnd;
    var runs = xml.slice(pOpenEnd, runsEnd);
    var m = runs.match(/charPrIDRef="(\d+)"/);
    var cp = m ? m[1] : '0';
    var text = fmt(value);
    var newRun = '<hp:run charPrIDRef="' + cp + '">' + (text ? '<hp:t>' + esc(text) + '</hp:t>' : '') + '</hp:run>';
    return xml.slice(0, pOpenEnd) + newRun + xml.slice(runsEnd);
  }

  function setName(xml, name) {
    var re = /교사 :\s+\(인\)/;
    if (!re.test(xml)) return xml;

  }

  /* 한 교사분 section 전체 */
  function fillSection(rec) {
    var xml = tpl.section;
    var vals = {};
    Object.keys(rec.scores).forEach(function (k) { vals[k] = rec.scores[k]; });
    Object.keys(rec.summary).forEach(function (k) { vals[k] = rec.summary[k]; });
    Object.keys(ROWS).forEach(function (row) { xml = setCell(xml, row, vals[ROWS[row]]); });
    return setName(xml, rec.name);
  }

  function splitSection(xml) {
    var open = xml.indexOf('<hp:p ');
    var close = xml.lastIndexOf('</hs:sec>');
    return { head: xml.slice(0, open), body: xml.slice(open, close), tail: xml.slice(close) };
  }

  /* 여러 교사분을 한 파일로: 두 번째부터 구역 설정 제거, 쪽 나눔, 표 ID 변경 */
  function combinedSection(recs) {
    var parts = recs.map(function (r, i) {
      var b = splitSection(fillSection(r)).body;
      if (i === 0) return b;
      b = b.replace(/<hp:secPr\b[\s\S]*?<\/hp:secPr>/, '').replace(/<hp:ctrl><hp:colPr\b[^>]*\/><\/hp:ctrl>/, '');
      b = b.replace(/<hp:p ([^>]*?)pageBreak="0"/, '<hp:p $1pageBreak="1"');

  function buildHwpx(sectionXml) {
    var z = new JSZip();
    // mimetype 은 반드시 첫 파일, 무압축
    z.file('mimetype', tpl.files['mimetype'], { compression: 'STORE' });

      if (n === 'mimetype') return;
      if (n === SECTION) z.file(n, sectionXml, { compression: 'DEFLATE' });

  function perTeacherZip(b64, recs, prefix) {

        return p.then(function () {

  }

      return buildHwpx(combinedSection(recs));
    }).then(function (bytes) { return new Blob([bytes], { type: 'application/hwp+zip' }); });
  }

  function single(b64, rec) {
    return load(b64).then(function () { return buildHwpx(fillSection(rec)); })

  }

  return { perTeacherZip: perTeacherZip, combined: combined, single: single, _fillSection: fillSection, _combinedSection: combinedSection, _load: load };
})();

  function teacherView() {
    var b = T.b, F = T.form, s = b.settings;

  function scoreCell(k, ro) {

  function fitArea(el) { if (!el) return; el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

  /* 교사 입력값 → 해당 항목. 자동 상태인 항목만 다시 계산 */
  var DEPENDS = { openCount: ['g4'], trainingHours: ['d'], award1: ['r1'], award2: ['r1'] };
  function autoValues() {
    var c = Calc.compute(T.b.ref, T.b.settings, T.form.inputs);
    if (!Calc.has(T.form.inputs.trainingHours)) { c.scores.d = null; c.basis.d = '연수 이수 시간을 노란 칸에 입력하면 자동으로 계산됩니다.'; }
    return c;
  }
  function applyAuto(keys, c) {
    var F = T.form;
    keys.forEach(function (k) {
      F.scores[k] = c.scores[k]; F.basis[k] = c.basis[k]; F.src[k] = 'auto';
      var si = document.querySelector('[data-bind=tScore][data-k="' + k + '"]');
      var bi = document.querySelector('[data-bind=tBasis][data-k="' + k + '"]');
      if (si) si.value = val(c.scores[k] === null ? '' : c.scores[k]);
      if (bi) { bi.value = c.basis[k] || ''; fitArea(bi); }
    });
  }
  function tRefresh() {
    var F = T.form;
    F.summary = Calc.summarize(F.scores);
    Calc.ITEMS.forEach(function (it) {
      var k = it.key;
      var e = document.getElementById('er-' + k);
      if (e) e.textContent = Calc.has(F.scores[k]) ? Calc.checkManual(k, F.scores[k]) : '';
      var bd = document.getElementById('sb-' + k);
      if (bd) bd.innerHTML = F.src[k] === 'auto' ? '<span class="badge info">자동</span>' : F.src[k] === 'edited' ? '<span class="badge amber">수정함</span>' : '';
    });
    ['ga', 'na', 'da', 'ra', 'total'].forEach(function (k) {
      var e = document.getElementById('sm-' + k);
      if (e) e.textContent = fmt(F.summary[k]);
    });
    document.querySelectorAll('textarea.basis-in').forEach(fitArea);

  function touch(k) {
    var F = T.form;

    else if (!F.src[k]) F.src[k] = 'manual';
    T.dirty = true;
  }
  BIND.tInput = function (el) {
    var F = T.form, k = el.dataset.k;
    F.inputs[k] = el.value === '' ? null : Number(el.value);
    T.dirty = true;
    if (T.b.ref) {
      var keys = DEPENDS[k].filter(function (x) { return F.src[x] === 'auto'; });
      if (keys.length) applyAuto(keys, autoValues());
    }
    tRefresh();
  };
  BIND.tScore = function (el) { var k = el.dataset.k; T.form.scores[k] = el.value === '' ? null : Number(el.value); touch(k); tRefresh(); };
  BIND.tBasis = function (el) { var k = el.dataset.k; T.form.basis[k] = el.value; touch(k); fitArea(el); tRefresh(); };
  BIND.tConfirm = function (el) { T.form.confirm = el.checked; };

  ACT.tAutoAll = function () {

      '<label class="f"><span>학교명</span><input type="text" class="w100" data-bind="aSet" data-k="schoolName" value="' + esc(S.schoolName) + '"></label>' +
      '<label class="f"><span>학년도</span><input type="text" class="w100" data-bind="aSet" data-k="year" value="' + esc(S.year) + '"></label>' +
      '<label class="f"><span>평가 기간</span><input type="text" class="w100" data-bind="aSet" data-k="period" value="' + esc(S.period) + '"></label>' +
      '<label class="f"><span>제출 마감(비우면 마감 없음)</span><input type="datetime-local" class="w100" data-bind="aSet" data-k="deadline" value="' + esc(dl) + '"></label>' +
      '<label class="f"><span>학교 평균 시수 직접 지정(비우면 자동 계산: ' + fmt(auto) + '시간)</span><input type="number" step="0.01" class="w100" data-bind="aSet" data-k="avgHoursManual" value="' + esc(val(S.avgHoursManual)) + '"></label>' +
      '</div><h3>① 예산 지원 사업 목록</h3><div class="row" style="margin-bottom:8px">' +
      (S.budgetList || []).map(function (n, i) { return '<span class="badge info">' + esc(n) + ' <a href="#" data-act="aBudDel" data-i="' + i + '" style="color:#b42318;text-decoration:none">×</a></span>'; }).join(' ') + '</div>' +
      '<div class="row"><input type="text" id="bud-new" placeholder="사업명" style="width:240px"><button class="btn sm" data-act="aBudAdd">추가</button></div>' +
      '<p class="muted small" style="margin:8px 0 0">사업을 추가하거나 뺀 뒤에는 아래 \'설정 저장\'을 눌러야 반영됩니다.</p>' +
      '<div class="savebar"><button class="btn primary" data-act="aSetSave">설정 저장</button></div></div>' +
      '<div class="card"><h2>관리자 비밀번호</h2><button class="btn" data-act="aPw">비밀번호 변경</button></div>';
  }
  BIND.aSet = function (el) { A.S[el.dataset.k] = el.value; };
  ACT.aBudAdd = function () {
    var v = document.getElementById('bud-new').value.trim();
    if (!v) return;
    if ((A.S.budgetList || []).indexOf(v) >= 0) return toast('이미 있는 사업입니다.', true);
    A.S.budgetList = (A.S.budgetList || []).concat([v]);
    render();
  };
  ACT.aBudDel = function (b) { A.S.budgetList.splice(Number(b.dataset.i), 1); render(); };
  ACT.aSetSave = function () {
    var removed = (A.D.settings.budgetList || []).filter(function (n) { return A.S.budgetList.indexOf(n) < 0; });
    busy(true);
    api('adminSaveSettings', A.token, A.S).then(function (s) {
      A.D.settings = s; A.S = clone(s);
      if (removed.length) {
        A.D.teachers.forEach(function (t) {
          var r = A.D.refs[t.id], b = r.matrix.budget || [];
          var nb = b.filter(function (n) { return removed.indexOf(n) < 0; });
          if (nb.length !== b.length) { r.matrix.budget = nb; A.dirty[t.id] = true; }
        });
      }
      busy(false);
      if (Object.keys(A.dirty).length && removed.length) return saveRefs();
      render(); toast('설정을 저장했습니다.');
    }).catch(fail);
  };
  ACT.aPw = function () { pwModal(false); };
  function pwModal(force) {
    modal('<h3>관리자 비밀번호 변경</h3>' + (force ? '<div class="notice amber">초기 비밀번호를 사용 중입니다. 보안을 위해 지금 변경해 주십시오.</div>' : '') +
      '<label class="f"><span>현재 비밀번호</span><input type="password" id="pw-old" class="w100"></label>' +
      '<label class="f"><span>새 비밀번호(8자 이상)</span><input type="password" id="pw-new" class="w100"></label>' +
      '<label class="f"><span>새 비밀번호 확인</span><input type="password" id="pw-new2" class="w100"></label>' +
      '<div class="foot">' + (force ? '' : '<button class="btn" data-act="closeModal">취소</button>') + '<button class="btn primary" data-act="aPwSave">변경</button></div>');
  }
  ACT.aPwSave = function () {
    var o = document.getElementById('pw-old').value, n = document.getElementById('pw-new').value, n2 = document.getElementById('pw-new2').value;
    if (n !== n2) return toast('새 비밀번호가 서로 다릅니다.', true);
    busy(true);
    api('adminChangePassword', A.token, o, n).then(function () { busy(false); closeModal(); toast('비밀번호를 변경했습니다.'); }).catch(fail);
  };

  render();
})();
</script>
</body>
</html>
